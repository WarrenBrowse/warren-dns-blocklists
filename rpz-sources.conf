# Warren DNS content-block sources, per category.
#
# Format: <category> <url>
#   category ∈ ads trackers malware adult gambling social
#   blank lines and #-comments ignored.
#
# These mirror the upstream Mullvad blocklist feeds
# (github.com/mullvad/dns-blocklists) so Warren's filtering tracks the same
# curated lists. warren-dns-refresh.sh fetches each URL, normalizes every
# supported format (RPZ / hosts / domain / wildcard) to bare domains via
# normalize-to-rpz.awk, and emits one RPZ zone per category.
#
# Keep this list conservative: every added source costs RAM (the zone is
# held in kresd) and risks over-blocking. Prefer the maintained aggregates
# (oisd, hagezi) over long tails of niche lists.

# --- ads --------------------------------------------------------------------
ads       https://small.oisd.nl/rpz
ads       https://v.firebog.net/hosts/AdguardDNS.txt
ads       https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/popupads-onlydomains.txt

