-- Warren exit DNS resolver (Knot Resolver / kresd).
--
-- The warren-exit binary serves no DNS itself; this is the resolver. It runs
-- a real recursive resolver with destination-based content filtering,
-- matching the Mullvad model.
--
-- ## Why kresd and not unbound (architecture decision)
--
-- The Mullvad daemon-fork encodes the active content filters in the last
-- octet of a 100.64.0.x resolver IP (ads=1, trackers=2, malware=4,
-- adult=8, gambling=16, social=32; OR-combined, see mullvad-daemon/src/
-- dns.rs). So the category lives in the DESTINATION address. unbound cannot
-- select blocklists by destination with shared memory:
--   * interface-tag + RPZ is broken (NLnet Labs unbound issue #1102, open;
--     affects 1.17.1 and 1.20.0).
--   * views support only local-zone/local-data and do NOT share memory, so
--     63 combos x large lists (esp. the ~1M-entry adult list) = many GB.
--   * the only working RPZ selector is access-control-tag (SOURCE based),
--     which would require encoding the category into the source via NAT, and
--     SNAT on the local-input path is not a standard netfilter capability.
-- kresd's Lua policy can read the query's DESTINATION address
-- (req.qsource.dst_addr, used by the upstream `view` module) and apply
-- shared RPZ matchers conditionally. RPZ data is parsed once at startup and
-- reused, so memory stays bounded regardless of how many of the 63 combos
-- clients use.
--
-- ## No-log
--
-- kresd does not log queries by default; we keep verbosity low and never
-- enable query logging. Combined with journald Storage=volatile on the host
-- (configured by the deployment side) nothing query-related is written to
-- disk. kresd recurses itself with QNAME minimisation (on by default), so no
-- third-party resolver sees the user's queries, unlike forwarding to Quad9
-- (cf. the Mullvad "hide all queries behind a single resolver" design).

-- Run as a single worker; raise via systemd if a busy exit needs more.
-- (kresd scales by running multiple kresd@N systemd instances sharing the
-- cache; the policy below is identical across instances.)

local ffi = require('ffi')

-- ---------------------------------------------------------------------------
-- Listening sockets (tunnel side only, never the public interface)
-- ---------------------------------------------------------------------------
-- The 100.64.0.0/24 block and 10.66.0.1 are made locally deliverable by the
-- deployment setup (`ip route add local 100.64.0.0/24 dev lo`). They are
-- reachable ONLY from inside the tunnel (nftables drops :53 on the public
-- NIC), so binding them does not expose an open resolver to the Internet.

-- Vanilla resolver: the tunnel gateway. DnsState::Default with no blockers
-- resolves here (talpid_dns default → tunnel gateway). No category policy
-- applies to this address.
net.listen('10.66.0.1', 53, { kind = 'dns' })

-- Content-block resolvers: 100.64.0.1 .. 100.64.0.63. The last octet is the
-- category bitmask the client composed. We bind every possible combination
-- so any client selection resolves.
for n = 1, 63 do
    net.listen('100.64.0.' .. n, 53, { kind = 'dns' })
end

-- ---------------------------------------------------------------------------
-- Modules
-- ---------------------------------------------------------------------------
modules = {
    'hints > iterate', -- built-in root hints for recursion
    'policy',
    'stats',
}

-- QNAME minimisation is enabled by default in kresd (the NO_MINIMIZE flag
-- would disable it); we rely on that default and never set NO_MINIMIZE, so
-- queries stay minimised. (There is no MINIMIZE_QTYPE flag; do not add one,
-- it fails config load on kresd 5.6.)

-- No-log: keep kresd quiet and never load a query-logging module (dnstap,
-- etc.). kresd does not log per-query data by default; this makes the
-- intent explicit and version-safe (log_level exists since 5.4). Combined
-- with journald Storage=volatile, nothing query-related can reach disk.
if log_level then
    log_level('warning')
end

-- ---------------------------------------------------------------------------
-- Cache: RAM-only, pinned to tmpfs so resolved QNAMEs NEVER touch disk
-- ---------------------------------------------------------------------------
-- The public no-log promise ("the resolver writes nothing to disk") requires
-- the LMDB cache to live on tmpfs. kresd's default backend is LMDB persisted in
-- its working directory; on a persistent-rootfs host that writes the set of
-- recently-resolved domain names to disk, where they survive a reboot or a
-- server seizure. We pin the cache to /run (tmpfs on every Warren exit image)
-- so it is RAM-only and wiped on reboot regardless of the host's rootfs. The
-- s6 launcher creates /run/knot-resolver at boot; a deploy-side check asserts
-- the path stays RAM-backed (/run or /dev/shm) so a disk-backed cache cannot
-- creep back in silently.
cache.open(100 * MB, 'lmdb:///run/knot-resolver')

-- ---------------------------------------------------------------------------
-- Content-block category table
-- ---------------------------------------------------------------------------
-- Each entry loads its RPZ zone ONCE (parsed at startup, shared across all
-- requests). policy.rpz(action, path) returns a matcher closure with the
-- signature function(_, query) -> action|nil (see upstream policy.lua). We
-- store the closure and invoke it only when the destination octet has the
-- category bit set. The RPZ files are produced by warren-dns-refresh.sh.
local RPZ_DIR = '/var/lib/knot-resolver/rpz'

local function load_category(name, bit)
    local path = RPZ_DIR .. '/' .. name .. '.rpz'
    -- watch=true reloads the zone in place when the refresh timer rewrites
    -- the file, so a blocklist update needs no kresd restart.
    local matcher = policy.rpz(
        policy.DENY_MSG('blocked by Warren DNS content filter (' .. name .. ')'),
        path,
        true
    )
    return { name = name, bit = bit, matcher = matcher }
end

-- Bit values mirror mullvad-daemon/src/dns.rs exactly.
local CATEGORIES = {
    load_category('ads', 1),
    load_category('trackers', 2),
    load_category('malware', 4),
    load_category('adult', 8),
    load_category('gambling', 16),
    load_category('social', 32),
}

-- ---------------------------------------------------------------------------
-- Destination decode
-- ---------------------------------------------------------------------------
-- Return the content-block category bitmask for a query, or nil if the query
-- did not arrive on a 100.64.0.x content-block address (vanilla / gateway).
-- dst_addr is a struct sockaddr*; addr:ip() yields the raw network-order
-- bytes (4 for IPv4), as used by the upstream view module.
-- AF_INET is a C preprocessor macro (not a linkable symbol), so ffi.C.AF_INET
-- is unavailable; use the stable Linux ABI value. The daemon only composes
-- IPv4 100.64.0.x content-block addresses, so non-IPv4 queries are vanilla.
local AF_INET = 2

local function content_block_mask(dst)
    if dst == nil or dst:family() ~= AF_INET then
        return nil
    end
    local ip = ffi.cast('uint8_t *', dst:ip())
    -- Only the 100.64.0.0/24 range carries a category mask.
    if ip[0] ~= 100 or ip[1] ~= 64 or ip[2] ~= 0 then
        return nil
    end
    local mask = ip[3]
    if mask == 0 then
        return nil
    end
    return mask
end

-- ---------------------------------------------------------------------------
-- The single destination-aware filtering rule
-- ---------------------------------------------------------------------------
-- Evaluated before recursion. If the query hit a content-block address, run
-- each enabled category's RPZ matcher; the first match denies. Otherwise the
-- query falls through to normal recursion (with any always-on protections).
policy.add(function(req, query)
    local mask = content_block_mask(req.qsource.dst_addr)
    if mask == nil then
        return nil
    end
    for _, cat in ipairs(CATEGORIES) do
        if bit.band(mask, cat.bit) ~= 0 then
            local action = cat.matcher(nil, query)
            if action ~= nil then
                return action
            end
        end
    end
    return nil
end)

-- Drop queries to obviously bogus / private-use names regardless of address
-- (defence in depth; standard kresd hygiene).
policy.add(policy.suffix(policy.DENY, policy.todnames({ 'corp.', 'home.arpa.' })))
